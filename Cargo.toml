[package]
name = "runcycles"
version = "0.3.2"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "Runtime authority for AI agents in Rust — hard limits on agent spend, risky tool actions, and audit gaps. Tokio-native client for the Cycles protocol (reserve-commit lifecycle, RAII guards)."
readme = "README.md"
repository = "https://github.com/runcycles/cycles-client-rust"
homepage = "https://runcycles.io"
documentation = "https://docs.rs/runcycles"
keywords = ["ai-agents", "llm", "budget", "governance", "audit-log"]
categories = ["api-bindings", "asynchronous", "web-programming::http-client"]
exclude = [".github/", "CLAUDE.md", "AUDIT.md", "tests/live_server_test.rs"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[badges]
maintenance = { status = "actively-developed" }

[features]
default = ["rustls-tls"]
blocking = ["tokio/rt-multi-thread"]
rustls-tls = ["reqwest/rustls-tls"]
native-tls = ["reqwest/native-tls"]

[dependencies]
bon = "3"
httpdate = "1"
pbkdf2 = "0.12"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["time", "sync", "macros"] }
tokio-util = "0.7"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
async-openai = { version = "0.41", default-features = false, features = ["chat-completion", "rustls"] }
pretty_assertions = "1"
proptest = "1"
tokio = { version = "1", features = ["full", "test-util"] }
wiremock = "0.6"
